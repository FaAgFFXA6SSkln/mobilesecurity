<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samsung E&A Demo</title>

<!-- QR 코드 인식 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  color: #fff;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #d83c4f;
  transition: .08s;
}


/* ============================================================
   상단
   ============================================================ */

.top-bar .logo{
    position:absolute;
    top:6.5%;
    left:50%;
    transform:translateX(-50%);
    width:60%;
    height:auto;
    display:block;
    pointer-events:none;
    user-select:none;
}

.phone{
    position:absolute;
    left:50%;
    top:12.5%;
    transform:translateX(-50%);
    font-size:15px;
    white-space:nowrap;
}


/* ============================================================
   카메라 버튼
   ============================================================ */

.top-bar .cam {
  position: absolute;
  right: 10%;
  top: 6.5%;
  width:10%;
  height:auto;
  cursor:pointer;
  z-index:20;
}


/* ============================================================
   중앙
   ============================================================ */

.card {
  position: relative;
  margin-top: -32.5%;
  z-index: 1;
  width: 85%;
  max-width: 85%;
  text-align: center;
}

.date {
  margin-top: 0px;
  font-size: 28px;
  letter-spacing: 4px;
}

.time {
  margin-top: 10px;
  font-size: 58px;
  letter-spacing: 1px;
}

.lock {
  width: 72px;
  height: 72px;
  margin: 12px auto 18px;
  font-size: 38px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.state {
  font-size: 24px;
}

.apply {
  font-size: 18px;
  margin-top: 8px;
  letter-spacing: 3px;
}


/* ============================================================
   하단 바
   ============================================================ */

.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 22%;
  z-index: 10;
}

.bottom-version {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 5%;
  z-index: 10;
}


.menu {
  display: flex;
  justify-content: space-around;
  font-size: 14px;
  margin-bottom: 5%;
}

.menu-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.menu-item span {
  font-size: 22px;
}


.bot-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:14px;
}

.bot-icon{
    width:36px;
    height:36px;
    object-fit:contain;
    margin-bottom:8px;
    display:block;
}


/* ============================================================
   제한된 기능
   ============================================================ */

.bottom-restricted-title {
   position: fixed;
   left: 5%;
   right: 0;
   bottom: 19%;
   z-index: 10;
   font-size: 14px;
}

.bottom-restricted {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10%;
  z-index: 10;

  display: flex;
  justify-content: space-around;
  align-items: center;
}


/* ============================================================
   버전
   ============================================================ */

.ver {
  font-size: 12px;
  text-align: center;
  margin-bottom: 0%;
  color: #ddd;
}


/* ============================================================
   팝업
   ============================================================ */

.popup{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.35);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}


/* 흰색 박스 */

.popup-box{
    width:78%;
    max-width:620px;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}


/* 메시지 */

.popup-text{
    padding:32px 25px 28px;
    text-align:center;
    font-size:17px;
    color:#222;
}


/* 구분선 */

.popup-line{
    height:1px;
    background:#e3e3e3;
    margin:0 28px;
}


/* 확인 버튼 */

#popupOk{
    display:block;
    width:150px;
    height:45px;
    margin:16px auto 20px;
    border:none;
    border-radius:10px;
    background:#2c9ad3;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

#popupOk:active{
    background:#228bc2;
}


/* ============================================================
   QR 카메라 화면
   ============================================================ */

#cameraScreen{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;

    background:#000;

    display:none;

    z-index:20000;
}


/* 카메라 영상 */

#cameraVideo{
    position:absolute;
    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;
}


/*
 * QR 인식 영역
 */

#qrGuide{
    position:absolute;

    width:65vw;
    height:65vw;

    max-width:420px;
    max-height:420px;

    left:50%;
    top:50%;

    transform:translate(-50%, -50%);

    box-sizing:border-box;

    border:3px solid rgba(255,255,255,.9);

    border-radius:12px;

    z-index:20002;

    pointer-events:none;
}


/*
 * QR 안내 문구
 */

#qrMessage{
    position:absolute;

    left:0;
    right:0;

    top:calc(50% + min(32.5vw, 210px) + 25px);

    text-align:center;

    font-size:17px;

    color:#fff;

    text-shadow:
        0 1px 3px #000,
        0 0 5px #000;

    z-index:20003;
}


/*
 * 카메라 닫기 버튼
 */

#cameraClose{
    position:absolute;

    top:25px;
    right:20px;

    width:48px;
    height:48px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.55);

    color:#fff;

    font-size:28px;

    z-index:20005;

    cursor:pointer;
}


/*
 * QR 인식 결과
 */

#qrResult {
    position: absolute;
    top: 75%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    text-align: center;
    color: white;
    font-size: 20px;
    z-index: 10;
}	


/*
 * QR 가이드 애니메이션
 */

#qrGuide::after{
    content:"";

    position:absolute;

    left:5%;
    right:5%;

    top:50%;

    height:2px;

    background:rgba(255,0,0,.8);

    animation:qrScan 1.8s linear infinite;
}


@keyframes qrScan{

    0%{
        transform:translateY(-120px);
    }

    50%{
        transform:translateY(120px);
    }

    100%{
        transform:translateY(-120px);
    }

}

</style>
</head>


<body>


<!-- ============================================================
     상단
     ============================================================ -->

<div class="top-bar">

    <div class="logo-wrap">

        <img
            class="logo"
            src="https://faagffxa6sskln.github.io/mobilesecurity/logo_ena.png"
            alt="SAMSUNG E&A"
        >

        <!-- 카메라 버튼 -->
        <img
            class="cam"
            src="https://faagffxa6sskln.github.io/mobilesecurity/ico_camera.png"
            width="7.5%"
            alt="카메라"
        >

    </div>


    <div class="phone">
        <span class="white-icon">☎</span> 01083708642
    </div>

</div>


<!-- ============================================================
     중앙 요소
     ============================================================ -->

<div class="card">

  <div class="date" id="date"></div>

  <div class="time" id="time"></div>


  <!-- 잠금 버튼 -->

  <div class="lock" id="lockBtn">

    <img
        src="https://faagffxa6sskln.github.io/mobilesecurity/lock_mig.png"
        width="100"
        height="100"
    >

  </div>


  <div class="state">
    보안정책 적용
  </div>

  <div class="apply" id="apply"></div>

</div>


<!-- ============================================================
     팝업
     ============================================================ -->

<div id="popup" class="popup">

  <div class="popup-box">

    <div class="popup-text">
      녹화된 화면이 아닙니다.
    </div>

    <div class="popup-line"></div>

    <button id="popupOk">
      확인
    </button>

  </div>

</div>


<!-- ============================================================
     하단 메뉴
     ============================================================ -->

<div class="bottom">

  <div class="menu">


    <div class="bot-item">

      <img
          src="https://faagffxa6sskln.github.io/mobilesecurity/btn_notice.png"
          class="bot-icon"
          alt=""
      >

      <div>공지/약관</div>

    </div>


    <div class="bot-item">

      <img
          src="https://faagffxa6sskln.github.io/mobilesecurity/btn_help_white.png"
          class="bot-icon"
          alt=""
      >

      <div>헬프데스크</div>

    </div>


    <div class="bot-item">

      <img
          src="https://faagffxa6sskln.github.io/mobilesecurity/btn_refresh.png"
          class="bot-icon"
          alt=""
      >

      <div>Refresh</div>

    </div>


    <div class="bot-item">

      <img
          src="https://faagffxa6sskln.github.io/mobilesecurity/btn_del_white.png"
          class="bot-icon"
          alt=""
      >

      <div>에이전트삭제</div>

    </div>


  </div>

</div>


<!-- ============================================================
     하단 제한된 기능
     ============================================================ -->

<div class="bottom-restricted-title">
  제한된 기능
</div>


<div class="bottom-restricted">


  <div class="bot-item">

    <img
        src="https://faagffxa6sskln.github.io/mobilesecurity/ico_camera.png"
        class="bot-icon"
        alt=""
    >

    <div>카메라</div>

  </div>


  <div class="bot-item">

    <img
        src="https://faagffxa6sskln.github.io/mobilesecurity/ico_usb.png"
        class="bot-icon"
        alt=""
    >

    <div>USB</div>

  </div>


  <div class="bot-item">

    <img
        src="https://faagffxa6sskln.github.io/mobilesecurity/ico_sd.png"
        class="bot-icon"
        alt=""
    >

    <div>저장매체</div>

  </div>


  <div class="bot-item">
    <div></div>
  </div>


</div>


<!-- ============================================================
     버전
     ============================================================ -->

<div class="bottom-version">

    <div class="ver">
      삼성 모바일보안 4.0.50
    </div>

</div>


<!-- ============================================================
     카메라 화면
     ============================================================ -->

<div id="cameraScreen">

    <!-- 카메라 영상 -->
    <video
        id="cameraVideo"
        autoplay
        muted
        playsinline
    ></video>


    <!-- QR 인식 영역 -->
    <div id="qrGuide"></div>


    <!-- 안내 -->
    <div id="qrMessage">
        QR 코드를 사각형 안에 맞춰주세요.
    </div>


    <!-- 닫기 -->
    <button id="cameraClose">
        ×
    </button>


    <!-- QR 결과 -->
    <div id="qrResult"></div>

</div>


<script>


/* ============================================================
   날짜 / 시간
   ============================================================ */

function u(){

  let n = new Date();

  let w = ["일","월","화","수","목","금","토"];


  date.textContent =
    `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}(${w[n.getDay()]})`;


  time.textContent =
    `${String(n.getHours()).padStart(2,"0")} : ${String(n.getMinutes()).padStart(2,"0")} : ${String(n.getSeconds()).padStart(2,"0")}`;


  apply.textContent =
    `적용시간∶${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")} 06:15`;

}

u();

setInterval(u,1000);


/* ============================================================
   배경 변경
   ============================================================ */

let r = true;

setInterval(() => {

  document.body.style.backgroundImage =
    `url('${r
      ? "https://faagffxa6sskln.github.io/mobilesecurity/background_lock_yellow.png"
      : "https://faagffxa6sskln.github.io/mobilesecurity/background_lock3.png"
    }')`;

  document.body.style.backgroundSize = "100% 100%";

  document.body.style.backgroundPosition = "center";

  document.body.style.backgroundRepeat = "no-repeat";

  r = !r;

}, 500);


/* ============================================================
   팝업
   ============================================================ */

const popup = document.getElementById("popup");


document.getElementById("lockBtn").addEventListener("click", () => {

    popup.style.display = "flex";

});


document.getElementById("popupOk").addEventListener("click", () => {

    popup.style.display = "none";

});


/* ============================================================
   QR 카메라
   ============================================================ */

const cameraScreen =
    document.getElementById("cameraScreen");

const cameraVideo =
    document.getElementById("cameraVideo");

const cameraClose =
    document.getElementById("cameraClose");

const qrMessage =
    document.getElementById("qrMessage");

const qrResult =
    document.getElementById("qrResult");


let cameraStream = null;

let qrScanning = false;


/*
 * QR 인식용 canvas
 */

const qrCanvas =
    document.createElement("canvas");

const qrContext =
    qrCanvas.getContext("2d", {
        willReadFrequently: true
    });


/* ============================================================
   카메라 시작
   ============================================================ */

async function startCamera() {
    const cameraScreen = document.getElementById("cameraScreen");
    const video = document.getElementById("cameraVideo");
    const qrResult = document.getElementById("qrResult");

    // 카메라 화면 표시
    cameraScreen.style.display = "flex";

    // 안내 문구
    qrResult.textContent = "QR코드를 인식해주세요.";

    // getUserMedia 지원 여부 확인
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        qrResult.textContent = "카메라를 사용할 수 없습니다.";
        return;
    }

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            },
            audio: false
        });

        // 카메라 스트림 연결
        video.srcObject = stream;

        // 영상 시작
        await video.play();

    } catch (error) {
        console.error("카메라 오류:", error);

        qrResult.textContent = "카메라를 사용할 수 없습니다.";
    }
	
	qrScanning = true;
	scanQRCode();
}


/* ============================================================
   QR 코드 스캔
   ============================================================ */

function scanQRCode() {
    if (!qrScanning) return;

    const video = document.getElementById("cameraVideo");

    if (video.readyState >= 2) {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const code = jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
                inversionAttempts: "attemptBoth"
            }
        );

        if (code) {
            const url = code.data.trim();

            // QR 코드 인식 중복 방지
            qrScanning = false;

            // 카메라 종료
            stopCamera();

            // QR 코드가 URL이면 해당 주소로 이동
            if (/^https?:\/\//i.test(url)) {
                window.location.href = url;
            } else {
                // URL이 아닌 경우에는 그대로 이동하지 않음
                console.log("QR 코드 내용:", url);
            }

            return;
        }
    }

    requestAnimationFrame(scanQRCode);
}


/* ============================================================
   카메라 종료
   ============================================================ */

function stopCamera(){

    qrScanning = false;


    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        cameraStream = null;

    }


    cameraVideo.srcObject =
        null;


    cameraScreen.style.display =
        "none";

}


/* ============================================================
   상단 카메라 버튼
   ============================================================ */

document
    .querySelector(".cam")
    .addEventListener("click", () => {

        startCamera();

    });


/* ============================================================
   카메라 닫기
   ============================================================ */

cameraClose.addEventListener(
    "click",
    () => {

        stopCamera();

    }
);


</script>

</body>
</html>
