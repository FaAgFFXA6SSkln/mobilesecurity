<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samsung E&A Demo</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  color: #fff;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #d83c4f;
  transition: .08s;
}


/* ============================================================
   상단
   ============================================================ */

.top-bar .logo{
    position:absolute;
    top:6.5%;
    left:50%;
    transform:translateX(-50%);
    width:60%;
    height:auto;
    display:block;
    pointer-events:none;
    user-select:none;
}

.phone{
    position:absolute;
    left:50%;
    top:12.5%;
    transform:translateX(-50%);
    font-size:15px;
    white-space:nowrap;
}


/* ============================================================
   카메라 버튼
   ============================================================ */

.top-bar .cam {
  position: absolute;
  right: 10%;
  top: 6.5%;
  width:10%;
  height:auto;

  /* 클릭 가능 */
  cursor:pointer;

  /* 다른 요소보다 위에 표시 */
  z-index:20;
}


/* ============================================================
   중앙
   ============================================================ */

.card {
  position: relative;
  margin-top: -32.5%;
  z-index: 1;
  width: 85%;
  max-width: 85%;
  text-align: center;
}

.date {
  margin-top: 0px;
  font-size: 28px;
  letter-spacing: 4px;
}

.time {
  margin-top: 10px;
  font-size: 58px;
  letter-spacing: 1px;
}

.lock {
  width: 72px;
  height: 72px;
  margin: 12px auto 18px;
  font-size: 38px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.state {
  font-size: 24px;
}

.apply {
  font-size: 18px;
  margin-top: 8px;
  letter-spacing: 3px;
}


/* ============================================================
   하단 바
   ============================================================ */

.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 22%;
  z-index: 10;
}

.bottom-version {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 5%;
  z-index: 10;
}


.menu {
  display: flex;
  justify-content: space-around;
  font-size: 14px;
  margin-bottom: 5%;
}

.menu-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.menu-item span {
  font-size: 22px;
}


.bot-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:14px;
}

.bot-icon{
    width:36px;
    height:36px;
    object-fit:contain;
    margin-bottom:8px;
    display:block;
}


/* ============================================================
   제한된 기능
   ============================================================ */

.bottom-restricted-title {
   position: fixed;
  left: 5%;
  right: 0;
  bottom: 19%;
  z-index: 10;
  font-size: 14px;
}

.bottom-restricted {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10%;
  z-index: 10;

  display: flex;
  justify-content: space-around;
  align-items: center;
}


/* ============================================================
   버전
   ============================================================ */

.ver {
  font-size: 12px;
  text-align: center;
  margin-bottom: 0%;
  color: #ddd;
}


/* ============================================================
   팝업
   ============================================================ */

.popup{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.35);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}


/* 흰색 박스 */

.popup-box{
    width:78%;
    max-width:620px;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}


/* 메시지 */

.popup-text{
    padding:32px 25px 28px;
    text-align:center;
    font-size:17px;
    color:#222;
}


/* 구분선 */

.popup-line{
    height:1px;
    background:#e3e3e3;
    margin:0 28px;
}


/* 확인 버튼 */

#popupOk{
    display:block;
    width:150px;
    height:45px;
    margin:16px auto 20px;
    border:none;
    border-radius:10px;
    background:#2c9ad3;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

#popupOk:active{
    background:#228bc2;
}

</style>
</head>


<body>


<!-- ============================================================
     상단
     ============================================================ -->

<div class="top-bar">

    <div class="logo-wrap">

        <img
            class="logo"
            src="https://faagffxa6sskln.github.io/mobilesecurity/logo_ena.png"
            alt="SAMSUNG E&A"
        >

        <!-- 카메라 버튼 -->
        <img
            class="cam"
            src="https://faagffxa6sskln.github.io/mobilesecurity/ico_camera.png"
            width="7.5%"
            alt="카메라"
        >

    </div>


    <div class="phone">
        <span class="white-icon">☎</span> 01083708642
    </div>

</div>


<!-- ============================================================
     중앙 요소
     ============================================================ -->

<div class="card">

  <div class="date" id="date"></div>

  <div class="time" id="time"></div>


  <!-- 잠금 버튼 -->

  <div class="lock" id="lockBtn">

    <img
        src="https://faagffxa6sskln.github.io/mobilesecurity/lock_mig.png"
        width="100"
        height="100"
    >

  </div>


  <div class="state">
    보안정책 적용
  </div>

  <div class="apply" id="apply"></div>

</div>


<!-- ============================================================
     팝업
     ============================================================ -->

<div id="popup" class="popup">

  <div class="popup-box">

    <div class="popup-text">
      녹화된 화면이 아닙니다.
    </div>

    <div class="popup-line"></div>

    <button id="popupOk">
      확인
    </button>

  </div>

</div>


<!-- ============================================================
     하단 메뉴
     ============================================================ -->

<div class="bottom">

  <div class="menu">


    <div class="bot-item">

      <img
          src="https://faagffxa6sskln.github.io/mobilesecurity/btn_notice.png"
          class="bot-icon"
          alt=""
      >

      <div>공지/약관</div>

    </div>


    <div class="bot-item">

      <img
          src="https://faagffxa6sskln.github.io/mobilesecurity/btn_help_white.png"
          class="bot-icon"
          alt=""
      >

      <div>헬프데스크</div>

    </div>


    <div class="bot-item">

      <img
          src="https://faagffxa6sskln.github.io/mobilesecurity/btn_refresh.png"
          class="bot-icon"
          alt=""
      >

      <div>Refresh</div>

    </div>


    <div class="bot-item">

      <img
          src="https://faagffxa6sskln.github.io/mobilesecurity/btn_del_white.png"
          class="bot-icon"
          alt=""
      >

      <div>에이전트삭제</div>

    </div>


  </div>

</div>


<!-- ============================================================
     하단 제한된 기능
     ============================================================ -->

<div class="bottom-restricted-title">
  제한된 기능
</div>


<div class="bottom-restricted">


  <div class="bot-item">

    <img
        src="https://faagffxa6sskln.github.io/mobilesecurity/ico_camera.png"
        class="bot-icon"
        alt=""
    >

    <div>카메라</div>

  </div>


  <div class="bot-item">

    <img
        src="https://faagffxa6sskln.github.io/mobilesecurity/ico_usb.png"
        class="bot-icon"
        alt=""
    >

    <div>USB</div>

  </div>


  <div class="bot-item">

    <img
        src="https://faagffxa6sskln.github.io/mobilesecurity/ico_sd.png"
        class="bot-icon"
        alt=""
    >

    <div>저장매체</div>

  </div>


  <div class="bot-item">
    <div></div>
  </div>


</div>


<!-- ============================================================
     버전
     ============================================================ -->

<div class="bottom-version">

    <div class="ver">
      삼성 모바일보안 4.0.50
    </div>

</div>


<script>

/* ============================================================
   날짜 / 시간
   ============================================================ */

function u(){

  let n = new Date();

  let w = ["일","월","화","수","목","금","토"];


  date.textContent =
    `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}(${w[n.getDay()]})`;


  time.textContent =
    `${String(n.getHours()).padStart(2,"0")} : ${String(n.getMinutes()).padStart(2,"0")} : ${String(n.getSeconds()).padStart(2,"0")}`;


  apply.textContent =
    `적용시간∶${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")} 06:15`;

}

u();

setInterval(u,1000);


/* ============================================================
   배경 변경
   ============================================================ */

let r = true;

setInterval(() => {

  document.body.style.backgroundImage =
    `url('${r
      ? "https://faagffxa6sskln.github.io/mobilesecurity/background_lock_yellow.png"
      : "https://faagffxa6sskln.github.io/mobilesecurity/background_lock3.png"
    }')`;

  document.body.style.backgroundSize = "100% 100%";

  document.body.style.backgroundPosition = "center";

  document.body.style.backgroundRepeat = "no-repeat";

  r = !r;

}, 500);


/* ============================================================
   팝업
   ============================================================ */

const popup = document.getElementById("popup");


document.getElementById("lockBtn").addEventListener("click", () => {

    popup.style.display = "flex";

});


document.getElementById("popupOk").addEventListener("click", () => {

    popup.style.display = "none";

});


/* ============================================================
   카메라 버튼
   ============================================================ */

/*
 * 갤럭시 S21에서
 * 상단 카메라 아이콘 클릭
 * → 삼성 기본 카메라 앱 실행
 */

document.querySelector(".cam").addEventListener("click", () => {

    const intentUrl =
        "intent://camera#Intent;" +
        "scheme=android-app;" +
        "package=com.sec.android.app.camera;" +
        "action=android.media.action.IMAGE_CAPTURE;" +
        "end";

    window.location.href = intentUrl;

});

</script>

</body>
</html>
